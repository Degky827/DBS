# Readiness probe for Render. Fails while any backend process is not healthy.
location = /healthz {
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 10s;
    proxy_pass http://127.0.0.1:5050;
}

# Service-to-service endpoints authenticate with the shared internal key and
# must never be reachable from the browser.
location ~ ^/api/(auth|user|kyc|notifications)/internal(/|$) {
    deny all;
}

location /api/auth/ {
    set $auth_upstream http://127.0.0.1:5001;
    rewrite ^/api/auth/(.*)$ /api/v1/$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
    proxy_pass $auth_upstream;
}

location /api/user/ {
    set $user_upstream http://127.0.0.1:5002;
    rewrite ^/api/user/(.*)$ /api/v1/$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
    proxy_pass $user_upstream;
}

location /api/kyc/ {
    set $kyc_upstream http://127.0.0.1:5003;
    rewrite ^/api/kyc/(.*)$ /api/v1/kyc/$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
    proxy_pass $kyc_upstream;
}

location /api/notifications/ {
    set $notification_upstream http://127.0.0.1:5004;
    rewrite ^/api/notifications/(.*)$ /api/v1/$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
    proxy_pass $notification_upstream;
}

location ^~ /uploads/avatars/ {
    set $avatar_upstream http://127.0.0.1:5002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
    proxy_pass $avatar_upstream;
}

location / {
    try_files $uri $uri/ /index.html;
}

location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}
