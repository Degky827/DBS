services:
  postgres:
    image: postgres:16-alpine
    container_name: banking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./backend/auth-service
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5001
      DB_ADAPTER: pg
      DATABASE_URL: postgresql://auth:auth@postgres:5432/auth_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      JWT_EXPIRES_IN: 15m
      JWT_ISSUER: auth-service
      JWT_AUDIENCE: banking-system
      BCRYPT_ROUNDS: 12
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}

      # Shared key guarding internal service-to-service endpoints.
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-internal-service-key}

      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-}
      EMAIL_FROM: ${EMAIL_FROM:-Meridian Bank}
      EMAIL_FROM_EMAIL: ${EMAIL_FROM_EMAIL:-no-reply@meridianbank.example}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      LOG_LEVEL: info
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 300
      AUTH_RATE_LIMIT_MAX: 10
      ENABLE_API_DOCS: "true"
    ports:
      - "5001:5001"

  user-service:
    build: ./backend/user-service
    container_name: user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5002
      DB_ADAPTER: pg
      DATABASE_URL: postgresql://auth:auth@postgres:5432/user_db?schema=public
      AUTH_MODE: ${USER_AUTH_MODE:-jwt}
      DEV_SESSION_TTL_MS: 28800000
      DEV_API_KEY: ${DEV_API_KEY:-}
      # auth-service integration (shared HS256 secret + issuer + audience).
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-banking-system}
      AUTH_SERVICE_URL: http://auth-service:5001/api/v1
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-internal-service-key}
      AVATAR_UPLOAD_DIR: /app/uploads/avatars
      BCRYPT_ROUNDS: 12
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: info
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 300
      AUTH_RATE_LIMIT_MAX: 20
      ENABLE_API_DOCS: "true"
    ports:
      - "5002:5002"
    volumes:
      - user_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AUTH_API: ${VITE_AUTH_API:-http://localhost:5001/api/v1}
        VITE_USER_API: ${VITE_USER_API:-http://localhost:5002/api/v1}
    container_name: banking-frontend
    restart: unless-stopped
    depends_on:
      - auth-service
      - user-service
    ports:
      - "8080:80"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: banking-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@meridianbank.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "false"
    ports:
      - "5051:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
  user_uploads:
