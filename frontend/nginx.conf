# TLS-terminating configuration for the SPA and API gateway.
#
# The container entrypoint (docker-entrypoint.d/40-configure-tls.sh) installs
# this file only when /etc/nginx/certs/tls.crt and /etc/nginx/certs/tls.key are
# present, or when TLS_ENABLED=true is set. Without certificates it installs
# nginx.http.conf instead (TLS terminated by an upstream load balancer).

# TLS is terminated here, so every proxied request is HTTPS regardless of a
# client-supplied X-Forwarded-Proto header.
map $scheme $client_proto {
    default https;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Container health probes and certificate renewals must stay reachable over
    # plain HTTP; everything else is redirected.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/banking/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    client_max_body_size 12m;

    include /etc/nginx/banking/snippets/locations.conf;
}
