# HTTP-only configuration used when TLS is terminated by an upstream load
# balancer or when the container runs without certificates (local SPA image).
#
# The container entrypoint installs this file when TLS_ENABLED is false or when
# no certificate is mounted under /etc/nginx/certs.

# Preserve the client-facing scheme when TLS is terminated upstream.
map $http_x_forwarded_proto $client_proto {
    default $scheme;
    http    http;
    https   https;
}

map $http_x_forwarded_proto $forwarded_https {
    default 0;
    https   1;
}

map $scheme $direct_https {
    default 0;
    https   1;
}

map "$direct_https$forwarded_https" $hsts_header {
    default "";
    "10"    "max-age=31536000; includeSubDomains";
    "01"    "max-age=31536000; includeSubDomains";
    "11"    "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security $hsts_header always;
    include /etc/nginx/banking/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    client_max_body_size 12m;

    include /etc/nginx/banking/snippets/locations.conf;
}
