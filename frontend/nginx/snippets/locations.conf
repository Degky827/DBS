# nginx resolves the hostname of a static proxy_pass once, when the worker
# starts, and never asks again. Recreating a backend container gives it a new
# IP, so the SPA keeps 502-ing until nginx itself restarts. A resolver plus a
# variable upstream makes nginx re-read Docker's embedded DNS on this TTL.
resolver 127.0.0.11 valid=10s ipv6=off;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Service-to-service endpoints authenticate with the shared internal key and
# must never be reachable from the browser. This regex location is evaluated
# before the prefix /api/ blocks, so it wins for /internal/ paths.
location ~ ^/api/(auth|user|kyc|notifications)/internal(/|$) {
    deny all;
}

# A proxy_pass that contains variables is not combined with the location prefix,
# so each block rewrites the browser path into the service path explicitly.
location /api/auth/ {
    set $auth_upstream http://auth-service:5001;
    rewrite ^/api/auth/(.*)$ /api/v1/$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
    proxy_pass $auth_upstream;
}

location /api/user/ {
    set $user_upstream http://user-service:5002;
    rewrite ^/api/user/(.*)$ /api/v1/$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
    proxy_pass $user_upstream;
}

location /api/kyc/ {
    set $kyc_upstream http://kyc-service:5003;
    rewrite ^/api/kyc/(.*)$ /api/v1/kyc/$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
    proxy_pass $kyc_upstream;
}

location /api/notifications/ {
    set $notification_upstream http://notification-service:5004;
    rewrite ^/api/notifications/(.*)$ /api/v1/$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
    proxy_pass $notification_upstream;
}

location ^~ /uploads/avatars/ {
    set $avatar_upstream http://user-service:5002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
    proxy_pass $avatar_upstream;
}

location / {
    try_files $uri $uri/ /index.html;
}

location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 1y;
    try_files $uri =404;
}
