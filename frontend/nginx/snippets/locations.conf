location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Service-to-service endpoints authenticate with the shared internal key and
# must never be reachable from the browser. This regex location is evaluated
# before the prefix /api/ blocks, so it wins for /internal/ paths.
location ~ ^/api/(auth|user|kyc|notifications)/internal(/|$) {
    deny all;
}

location /api/auth/ {
    proxy_pass http://auth-service:5001/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
}

location /api/user/ {
    proxy_pass http://user-service:5002/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
}

location /api/kyc/ {
    proxy_pass http://kyc-service:5003/api/v1/kyc/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
}

location /api/notifications/ {
    proxy_pass http://notification-service:5004/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
}

location ^~ /uploads/avatars/ {
    proxy_pass http://user-service:5002/uploads/avatars/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
}

location / {
    try_files $uri $uri/ /index.html;
}

location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 1y;
    try_files $uri =404;
}
